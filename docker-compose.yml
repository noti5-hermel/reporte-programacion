services:
  reporteria-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_REPORTS_API_URL: ${VITE_REPORTS_API_URL:-}
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-}
        VITE_AUTH_HEALTH_URL: ${VITE_AUTH_HEALTH_URL:-}
        VITE_AUTH_FRONTEND_URL: ${VITE_AUTH_FRONTEND_URL:-}
    container_name: reporteria-frontend
    ports:
      - "85:80"
    environment:
      - NODE_ENV=production
      - TZ=America/El_Salvador
      - REPORTS_API_UPSTREAM=${REPORTS_API_UPSTREAM:-http://reports-api:8107}
      - AUTH_API_UPSTREAM=${AUTH_API_UPSTREAM:-http://auth-api:8081}
    restart: unless-stopped
    networks:
      - reporteria-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  reporteria-network:
    external: true
