# Plantilla de nginx: el entrypoint oficial de la imagen sustituye
# ${REPORTS_API_UPSTREAM} y ${AUTH_API_UPSTREAM} con variables de entorno.
# DNS embebido de Docker. Los upstreams se resuelven en cada petición, no al
# arrancar: así el contenedor sirve la SPA aunque auth-api (servicio externo)
# no exista todavía en la red. Sin esto nginx muere con "host not found in
# upstream" y el restart policy entra en bucle.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API de reportes (mismo origen para el navegador)
    location /api/ {
        set $reports_upstream "${REPORTS_API_UPSTREAM}";
        proxy_pass $reports_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servicio de autenticación externo: /auth-api/api/... -> /api/...
    location /auth-api/ {
        rewrite ^/auth-api/(.*)$ /$1 break;
        set $auth_upstream "${AUTH_API_UPSTREAM}";
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
